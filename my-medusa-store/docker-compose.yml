version: '3.9'

services:
  # Postgres database
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - medusa_network

  # Medusa backend
  medusa:
    build:
      context: ./my-medusa-store
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "9000:9000"  # Only backend port
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/medusa-store?sslmode=disable
      REDIS_URL: redis://redis:6379
    networks:
      - medusa_network

  # Storefront frontend
  storefront:
    build:
      context: ./my-medusa-store-storefront
    container_name: medusa_storefront
    depends_on:
      - medusa
    ports:
      - "5173:5173"  # Frontend port
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://medusa:9000
    command: yarn dev -H 0.0.0.0 -p 5173
    networks:
      - medusa_network

volumes:
  postgres_data:

networks:
  medusa_network:
    driver: bridge
