version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network

  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - medusa_network

  medusa:
    build: ./my-medusa-store
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "9000:9000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/medusa-store?sslmode=disable
      REDIS_URL: redis://redis:6379
    volumes:
      - ./my-medusa-store:/server
      - /server/node_modules
    networks:
      - medusa_network

  storefront:
    build: ./my-medusa-store-storefront
    container_name: medusa_storefront
    restart: unless-stopped
    depends_on:
      - medusa
    ports:
      - "8000:8000"
    environment:
      MEDUSA_BACKEND_URL: http://medusa_backend:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_1896a89dabbd397f67ad3d4bbcb94c8cc84545fac9024443fe2c99b56089f98f
    command: sh -c "corepack enable && yarn install && yarn dev -p 8000 --hostname 0.0.0.0"
    volumes:
      - ./my-medusa-store-storefront:/storefront
    networks:
      - medusa_network

volumes:
  postgres_data:

networks:
  medusa_network:
    driver: bridge
